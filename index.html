              <span class="ic">${ic((L.doccat[d.category] || L.doccat.other)[1])}</span>
              <span class="bd"><b>${esc(d.title)}</b>
                <span class="meta">${esc((L.doccat[d.category] || L.doccat.other)[0])}${d.doc_no ? ' · ' + esc(d.doc_no) : ''}${d.issued_at ? ' · ' + fmtDate(d.issued_at) : ''}</span>
                <span class="meta">${d.attachment_id ? `${ic(d.mime === 'application/pdf' ? 'file' : 'camera', 'sm')} ${d.mime === 'application/pdf' ? 'PDF' : 'ภาพ'}${d.size ? ' · ' + fmtSize(d.size) : ''}` : d.url ? `${ic('link', 'sm')} ลิงก์` : d.maintenance_id ? 'รายงานจากระบบ' : '<span class="tag bad">ยังไม่มีไฟล์</span>'}
                  ${d.model && !d.vehicle_id ? `<span class="tag">ทุกคันรุ่น ${esc(d.model)}</span>` : ''}
                  ${exp != null ? (exp < 0 ? '<span class="tag bad">หมดอายุ</span>' : exp <= 45 ? `<span class="tag acc">หมดอายุอีก ${exp} วัน</span>` : `<span class="tag">ถึง ${fmtDate(d.expires_at)}</span>`) : ''}</span></span>
              ${hasFile ? ic('chevR', 'sm') : ''}</button>
            <div class="docact">
              <button class="btn btn-ghost btn-sm" data-view="${d.id}" ${hasFile ? '' : 'disabled'}>${ic('eye', 'sm')} ดู</button>
              ${d.url ? `<button class="btn btn-ghost btn-sm" data-qr="${d.id}">${ic('qr', 'sm')} QR</button>` : ''}
              ${d.can_edit ? `<button class="btn btn-ghost btn-sm" data-edit="${d.id}">${ic('edit', 'sm')} แก้ไข</button>
                <button class="btn btn-ghost btn-sm" data-del="${d.id}" style="color:#FF9C8A">${ic('trash', 'sm')} ลบ</button>` : ''}</div></div>`;
        }).join('') : `<div class="glass empty">${ic('doc')}<b>ยังไม่มีเอกสาร</b>${canAddDoc() ? 'กด "อัปโหลดเอกสาร" เพื่อเพิ่มใบส่งมอบ ประกันภัย พ.ร.บ. คู่มือ หรือเอกสารอื่น (PDF/ภาพ ไม่เกิน 4 MB)' : 'เอกสารจะแสดงที่นี่เมื่อ SMART CS อัปโหลด'}</div>`}</div>`;
      const byId = id => docs.find(d => d.id === id);
      $$('[data-cat]', view).forEach(b => b.addEventListener('click', () => { cat = b.dataset.cat; history.replaceState(null, '', '#/docs?cat=' + cat); draw(); }));
      $$('[data-open],[data-view]', view).forEach(b => b.addEventListener('click', () => openDoc(byId(b.dataset.open || b.dataset.view))));
      $$('[data-qr]', view).forEach(b => b.addEventListener('click', () => { const d = byId(b.dataset.qr); showQR(d.title, d.url, 'สแกนเพื่อเปิดเอกสาร'); }));
      $$('[data-edit]', view).forEach(b => b.addEventListener('click', () => docForm(byId(b.dataset.edit))));
      $$('[data-del]', view).forEach(b => b.addEventListener('click', async () => { if (await deleteDoc(byId(b.dataset.del))) render(); }));
      $('#dc-add', view)?.addEventListener('click', () => docForm(null));
    };
    draw();
  }
});

    <label class="fl" for="df-c">หมวด</label><select class="in" id="df-c">${Object.entries(L.doccat).map(([k, [l]]) => `<option value="${k}" ${(d?.category || 'other') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
    ${staff ? `<label class="fl" for="df-sc">ใช้กับ</label><select class="in" id="df-sc"><option value="vehicle" ${!d || d.vehicle_id ? 'selected' : ''}>รถคันนี้ (${esc(S.vehicle?.plate || '')})</option>
      ${S.models.map(m => `<option value="m:${esc(m)}" ${d && !d.vehicle_id && d.model === m ? 'selected' : ''}>ทุกคันรุ่น ${esc(m)}</option>`).join('')}<option value="all" ${d && !d.vehicle_id && !d.model ? 'selected' : ''}>ทุกคันทุกรุ่น</option></select>` : ''}
    <div class="row2"><div><label class="fl" for="df-n">เลขที่เอกสาร</label><input class="in" id="df-n" maxlength="60" value="${esc(d?.doc_no || '')}"></div>
      <div><label class="fl" for="df-i">วันที่ออก</label><input class="in" id="df-i" type="date" value="${d?.issued_at || ''}"></div></div>
    <label class="fl" for="df-e">วันหมดอายุ (ถ้ามี — ระบบจะแจ้งเตือนก่อนหมดอายุ)</label><input class="in" id="df-e" type="date" value="${d?.expires_at || ''}">
    <label class="fl" for="df-u">หรือใส่ลิงก์เอกสาร (https://)</label><input class="in" id="df-u" type="url" maxlength="1000" value="${esc(d?.url || '')}" placeholder="ไม่บังคับ ถ้าแนบไฟล์แล้ว">
    <div class="btn-row">${d ? `<button class="btn btn-ghost" id="df-del" style="color:#FF9C8A;flex:0 0 auto">${ic('trash', 'sm')} ลบ</button>` : ''}<button class="btn btn-ghost" data-close>ยกเลิก</button><button class="btn btn-acc" id="df-s">${d ? 'บันทึก' : 'อัปโหลด'}</button></div>`);
  const pick = async (accept, cam = false) => {
    const [f] = await pickFiles(accept, false, cam); if (!f) return;
    try {
      if (f.type === 'application/pdf') {
        if (f.size > 4 * 1024 * 1024) { toast('ไฟล์ PDF ใหญ่เกิน 4 MB — กรุณาบีบอัดหรือใช้ลิงก์แทน', true); return; }
        file = await readFileB64(f);
      } else if (f.type.startsWith('image/')) file = await compressImage(f, 2000, 0.8);
      else { toast('รองรับเฉพาะ PDF หรือภาพ', true); return; }
      $('#df-fn', sh.el).innerHTML = `${ic('check', 'sm')} ${esc(f.name)} · ${fmtSize(Math.round(file.data.length * 0.75))}`;
      const t = $('#df-t', sh.el); if (!t.value.trim()) t.value = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
    } catch (e) { toast(e.message, true); }
  };
  $('#df-f', sh.el).onclick = () => pick('application/pdf,image/*');
  $('#df-cam', sh.el).onclick = () => pick('image/*', true);
  $('#df-view', sh.el)?.addEventListener('click', () => openAttachment(d.attachment_id, d.file_name || d.title));
  $('#df-s', sh.el).onclick = e => withBusy(e.currentTarget, async () => {
    const sc = staff ? $('#df-sc', sh.el).value : 'vehicle';
    const p = { id: d?.id || null, category: $('#df-c', sh.el).value, title: $('#df-t', sh.el).value.trim(), doc_no: $('#df-n', sh.el).value,
      issued_at: $('#df-i', sh.el).value, expires_at: $('#df-e', sh.el).value, url: $('#df-u', sh.el).value.trim(),
      vehicle_id: sc === 'vehicle' ? S.vid : null, model: sc.startsWith('m:') ? sc.slice(2) : null };
    if (!p.title) { toast('กรุณาระบุชื่อเอกสาร', true); $('#df-t', sh.el).focus(); return; }
    if (!p.url && !file && !d?.attachment_id) { toast('กรุณาเลือกไฟล์ หรือใส่ลิงก์เอกสาร', true); return; }
    const r = await run('cs_doc_save', { p_token: T(), p });
    if (!r) return;
    if (file && !await run('cs_attach_add', { p_token: T(), p_ref_type: 'document', p_ref: r.id, p_name: file.name, p_mime: file.mime, p_data: file.data })) {
      toast('บันทึกข้อมูลแล้ว แต่อัปโหลดไฟล์ไม่สำเร็จ — กดแก้ไขเพื่อแนบใหม่', true); sh.close(); render(); return;
    }
    toast(d ? 'บันทึกเอกสารแล้ว' : 'อัปโหลดเอกสารแล้ว'); sh.close(); render();
  });
  $('#df-del', sh.el)?.addEventListener('click', async () => { if (await deleteDoc(d)) { sh.close(); render(); } });
}

        $('#ct-send').onclick = e => withBusy(e.currentTarget, send);

      } else if (tab === 'faq') {

          <div class="stars" id="fb-stars" role="radiogroup" aria-label="คะแนน">${[1, 2, 3, 4, 5].map(n => `<button type="button" role="radio" aria-checked="false" aria-label="${n} ดาว" data-n="${n}">${starSvg}</button>`).join('')}</div>

          <label class="fl" for="fb-b">ความคิดเห็น <span class="req">*</span></label><textarea class="in" id="fb-b" maxlength="2000" placeholder="ข้อเสนอแนะ คำชม หรือสิ่งที่ควรปรับปรุง"></textarea>
          <div class="btn-row"><button class="btn btn-acc" id="fb-s">ส่งความคิดเห็น</button></div></div>`;
        $$('#fb-stars button').forEach(b => b.onclick = () => { rating = +b.dataset.n; $$('#fb-stars button').forEach(x => { x.classList.toggle('on', +x.dataset.n <= rating); x.setAttribute('aria-checked', +x.dataset.n === rating); }); });
        $('#fb-s').onclick = e => {
          const body = $('#fb-b').value.trim();
          if (body.length < 5) { toast('กรุณาพิมพ์ความคิดเห็นอย่างน้อย 5 ตัวอักษร', true); return; }
          withBusy(e.currentTarget, async () => { if (await run('cs_feedback_save', { p_token: T(), p_vehicle: S.vid, p_topic: $('#fb-t').value, p_rating: rating || null, p_body: body }, 'ขอบคุณสำหรับความคิดเห็น')) { $('#fb-b').value = ''; rating = 0; $$('#fb-stars button').forEach(x => x.classList.remove('on')); } });
        };
      }
    };
    await draw();
  }
});
async function emergency() {
  const kind = await choose('แจ้งเหตุฉุกเฉิน — เกิดอะไรขึ้น?', [
    { value: 'อุบัติเหตุ', label: 'อุบัติเหตุ', icon: 'crash' }, { value: 'รถดับ/เสียกลางทาง', label: 'รถดับ / เสียกลางทาง', icon: 'wrench' },
    { value: 'ควัน/กลิ่นไหม้/แบตเตอรี่ผิดปกติ', label: 'ควัน กลิ่นไหม้ แบตเตอรี่ผิดปกติ', sub: 'ออกห่างจากรถทันที · ไฟไหม้โทร 199', icon: 'siren' },
    { value: 'เหตุร้าย/ความปลอดภัย', label: 'เหตุร้าย / ความปลอดภัย', sub: 'โทร 191', icon: 'shield' }, { value: 'อื่น ๆ', label: 'อื่น ๆ', icon: 'dots' }]);
  if (!kind) return;
  toast('กำลังระบุตำแหน่ง…');
  const p = await getGPS();
  const loc = p ? `ตำแหน่ง: https://maps.google.com/?q=${p.lat.toFixed(6)},${p.lng.toFixed(6)}` : 'ตำแหน่ง: ไม่ได้รับสิทธิ์ GPS';
  const note = await confirmBox('ส่งแจ้งเหตุฉุกเฉิน', `<b>${esc(kind)}</b>\n${esc(loc)}\n\nมีผู้บาดเจ็บโทร 1669 ทันที`, { ok: 'ส่งแจ้งเหตุ', danger: true, input: { label: 'รายละเอียดเพิ่มเติม (ถ้ามี)', placeholder: 'เช่น จุดสังเกต อาการรถ', max: 1000 } });
  if (note === null) return;
  const v = S.home?.vehicle || S.vehicle || {};
  const body = `แจ้งเหตุฉุกเฉิน: ${kind}\nรถ ${v.model || ''} ทะเบียน ${v.plate || ''}\n${loc}${note ? '\nรายละเอียด: ' + note : ''}`;
  if (await run('cs_msg_send', { p_token: T(), p_vehicle: S.vid, p_body: body, p_ticket: null, p_emergency: true }, 'ส่งแจ้งเหตุถึง SMART CS แล้ว')) {
    const create = await confirmBox('สร้าง Ticket ด้วยไหม?', 'เพื่อให้ติดตามงานและแนบภาพได้', { ok: 'สร้าง Ticket', cancel: 'ไม่ตอนนี้' });
    if (create) {
      const cat = kind === 'อุบัติเหตุ' ? 'accident' : kind.startsWith('รถดับ') ? 'breakdown' : 'help';
      sstore.set('mcs_ai_draft', { category: cat, priority: 'urgent', title: 'แจ้งเหตุฉุกเฉิน: ' + kind, detail: (note || kind), location: p ? `พิกัด ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}` : '' });
      go('request?from=ai');
    } else go('contact?tab=chat');
  }
}

function changePassword() {
  const sh = openSheet(`<h3>${ic('lock')} เปลี่ยนรหัสผ่าน</h3>

  $('#pw-s', sh.el).onclick = e => {

  };
}

      <div class="row2"><div><label class="fl" for="st-line">LINE ID</label><input class="in" id="st-line" value="${esc(sp.line_id || '')}"></div>
        <div><label class="fl" for="st-mail">อีเมล</label><input class="in" id="st-mail" type="email" value="${esc(sp.email || '')}"></div></div>
      <div class="btn-row"><button class="btn btn-acc" id="st-s">บันทึก</button></div></div>
      <div class="glass card"><h5>รุ่นรถ (ใช้เป็น Username)</h5><p class="hint">หนึ่งบรรทัดต่อหนึ่งรุ่น · ต้องสะกดตรงกับข้อมูลรถ</p>
        <textarea class="in" id="st-models">${esc((pi.models || []).join('\n'))}</textarea><div class="btn-row"><button class="btn btn-ghost" id="st-ms">บันทึกรุ่นรถ</button></div></div>`;
    $('#st-s').onclick = e => withBusy(e.currentTarget, async () => {
      const v = { ...sp, company: $('#st-co').value.trim(), cs_phone: $('#st-ph').value.trim() || null, cs_hotline_hours: $('#st-hr').value.trim() || null,
        emergency_phone: $('#st-em').value.trim() || null, emergency_name: $('#st-emn').value.trim() || null, line_id: $('#st-line').value.trim() || null, email: $('#st-mail').value.trim() || null };
      if (await run('cs_admin_config_save', { p_token: T(), p_key: 'support', p_value: v }, 'บันทึกแล้ว')) S.support = v;
    });
    $('#st-ms').onclick = e => withBusy(e.currentTarget, async () => {
      const ms = [...new Set($('#st-models').value.split('\n').map(x => x.trim()).filter(Boolean))];
      if (await run('cs_admin_config_save', { p_token: T(), p_key: 'models', p_value: ms }, 'บันทึกรุ่นรถแล้ว')) S.models = ms;
    });
  }
});
route('admin-audit', {
  title: 'Audit Log', nav: 'profile', needVehicle: false,

    let onlyV = false;
    const draw = async () => {

        <div class="glass card" style="padding:6px 10px;overflow-x:auto"><table class="table"><thead><tr><th>เวลา</th><th>ผู้กระทำ</th><th>การกระทำ</th></tr></thead><tbody>
        ${list.map(a => `<tr><td class="num" style="white-space:nowrap">${fmtDate(a.at, true)}</td><td>${esc(a.actor_name || '')}<br><small style="color:var(--mut)">${esc(L.role[a.role] || a.role || '')}</small></td>
          <td><b>${esc(a.action)}</b> · ${esc(a.entity)}${a.entity_id ? `<br><small style="color:var(--mut);word-break:break-all">${esc(String(a.entity_id).slice(0, 8))}</small>` : ''}</td></tr>`).join('')}</tbody></table></div>`;

/* =====================================================================
   BOOT
   ===================================================================== */
function boot() {
  const s = store.get('mcs_sess');
  if (s?.token) Object.assign(S, { token: s.token, kind: s.kind, role: s.role, vid: s.vid });
  const upd = () => { const o = !navigator.onLine; let b = $('.offline'); if (o && !b) { b = document.createElement('div'); b.className = 'offline'; b.textContent = 'ออฟไลน์ — ข้อมูลอาจไม่เป็นปัจจุบัน'; document.body.appendChild(b); } else if (!o && b) b.remove(); };
  addEventListener('online', upd); addEventListener('offline', upd); upd();
  if (window.visualViewport) visualViewport.addEventListener('resize', () => document.body.classList.toggle('kb', visualViewport.height < innerHeight * 0.75));
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
}
boot();

/* ---------- ผู้มีสิทธิ์ใช้รถ (Username = ชื่อ-สกุล, Password = เลขทะเบียน) ---------- */
async function vehicleUsersSheet(v) {
  const list = await run('cs_vehicle_users_list', { p_token: T(), p_vehicle: v.id });
  if (!list) return;
  const sh = openSheet(`<h3>${ic('users')} ผู้มีสิทธิ์เข้าใช้แอป</h3>
    <p class="lead">${esc(v.model)} · ทะเบียน ${esc(v.plate)}<br>เข้าระบบด้วย <b>Username = ชื่อ-สกุล</b> และ <b>Password = เลขทะเบียน ${esc(v.plate)}</b></p>
    <div class="list">${list.length ? list.map(u => `<div class="well item" style="${u.active ? '' : 'opacity:.55'}"><span class="ic">${ic('user')}</span>
      <span class="bd"><b>${esc(u.full_name)}</b><span class="meta">${u.position ? esc(u.position) + ' · ' : ''}${u.phone ? esc(u.phone) + ' · ' : ''}${u.active ? (u.last_login ? 'เข้าล่าสุด ' + fmtRel(u.last_login) : 'ยังไม่เคยเข้าระบบ') : '<span class="tag bad">ระงับ</span>'}</span></span>
      <button class="icon-btn" data-vu="${u.id}" aria-label="แก้ไข">${ic('edit', 'sm')}</button></div>`).join('')
      : `<div class="empty" style="padding:16px">ยังไม่มีผู้มีสิทธิ์ — เพิ่มชื่อผู้ใช้รถอย่างน้อย 1 คน</div>`}</div>
    <div class="btn-row"><button class="btn btn-ghost" data-close>ปิด</button><button class="btn btn-acc" id="vu-add">${ic('plus', 'sm')} เพิ่มผู้ใช้</button></div>`);
  $('#vu-add', sh.el).onclick = () => { sh.close(); vehicleUserForm(v, null); };
  $$('[data-vu]', sh.el).forEach(b => b.onclick = () => { sh.close(); vehicleUserForm(v, list.find(u => u.id === b.dataset.vu)); });
}
function vehicleUserForm(v, u) {
  const sh = openSheet(`<h3>${ic('user')} ${u ? 'แก้ไขผู้ใช้รถ' : 'เพิ่มผู้ใช้รถ'}</h3>
    <label class="fl" for="vu-n">ชื่อ-สกุล (ใช้เป็น Username) <span class="req">*</span></label><input class="in" id="vu-n" maxlength="120" value="${esc(u?.full_name || '')}" placeholder="เช่น นายสมชาย ใจดี" autocomplete="off">
    <p class="hint">ตอนเข้าระบบ พิมพ์มีหรือไม่มีคำนำหน้า (นาย/นาง/นางสาว) และเว้นวรรคต่างกันได้</p>
    <div class="row2"><div><label class="fl" for="vu-p">ตำแหน่ง</label><input class="in" id="vu-p" maxlength="120" value="${esc(u?.position || '')}"></div>
      <div><label class="fl" for="vu-t">เบอร์โทร</label><input class="in" id="vu-t" type="tel" maxlength="20" value="${esc(u?.phone || '')}"></div></div>
    ${u ? `<label class="toggle"><span>อนุญาตให้เข้าระบบ</span><span class="sw"><input type="checkbox" id="vu-a" ${u.active ? 'checked' : ''}><span></span></span></label>` : ''}
    <div class="btn-row">${u ? `<button class="btn btn-ghost" id="vu-del" style="color:#FF9C8A;flex:0 0 auto">${ic('trash', 'sm')} ลบ</button>` : ''}<button class="btn btn-ghost" id="vu-back">ย้อนกลับ</button><button class="btn btn-acc" id="vu-s">บันทึก</button></div>`);
  const back = () => { sh.close(); vehicleUsersSheet(v); };
  $('#vu-back', sh.el).onclick = back;
  $('#vu-s', sh.el).onclick = e => withBusy(e.currentTarget, async () => {
    const p = { id: u?.id || null, vehicle_id: v.id, full_name: $('#vu-n', sh.el).value, position: $('#vu-p', sh.el).value, phone: $('#vu-t', sh.el).value.trim() || null,
      active: u ? $('#vu-a', sh.el).checked : true };
    if (!p.full_name.trim()) { toast('กรุณากรอกชื่อ-สกุล', true); return; }
    if (await run('cs_vehicle_user_save', { p_token: T(), p }, 'บันทึกแล้ว')) back();
  });
  $('#vu-del', sh.el)?.addEventListener('click', async () => {
    if (await confirmBox('ลบสิทธิ์ผู้ใช้นี้?', `${esc(u.full_name)} จะเข้าระบบด้วยรถ ${esc(v.plate)} ไม่ได้อีก`, { ok: 'ลบสิทธิ์', danger: true }) &&
        await run('cs_vehicle_user_remove', { p_token: T(), p_id: u.id }, 'ลบสิทธิ์แล้ว')) back();
    else vehicleUsersSheet(v);
  });
}

/* ---------- สายด่วน (ใช้ร่วมกัน: หน้า AI CS Agent และหลังส่งแจ้งบริการ) ---------- */
const telOf = p => String(p || '').replace(/[^\d+]/g, '');
function callRow(phone, name, sub) {
  return `<a class="rowlink call" href="tel:${esc(telOf(phone))}">${ic('phone')}<span>${esc(name)}<br><small>${esc(phone)}${sub ? ' · ' + esc(sub) : ''}</small></span>${ic('chevR', 'sm')}</a>`;
}
function hotlinesSync() {
  const sp = S.support || {}, out = [];
  if (sp.emergency_phone) out.push({ phone: sp.emergency_phone, name: sp.emergency_name || 'สายด่วน SMART', sub: '' });
  if (sp.cs_phone) out.push({ phone: sp.cs_phone, name: 'SMART Customer Service', sub: sp.cs_hotline_hours || '' });
  return out;
}
const contactsCache = {};
async function getHotlines() {
  const out = hotlinesSync();
  if (S.vid) {
    let cs = contactsCache[S.vid];
    if (!cs) { cs = (await api('cs_vehicle_get', { p_token: T(), p_vehicle: S.vid })).contacts || []; contactsCache[S.vid] = cs; }
    cs.filter(c => c.phone && ['smart_cs', 'smart_manager', 'emergency'].includes(c.kind))
      .forEach(c => out.push({ phone: c.phone, name: c.name, sub: c.position || L.ckind[c.kind] || '' }));
  }
  const seen = new Set();
  return out.filter(x => { const k = telOf(x.phone); if (!k || seen.has(k)) return false; seen.add(k); return true; });
}
// หลังส่งแจ้งบริการสำเร็จ: ถามว่าต้องการโทรสายด่วนด้วยไหม
async function askHotline(t) {
  let list = [];
  try { list = await getHotlines(); } catch {}
  const urgent = t.category === 'accident' || t.priority === 'urgent';
  const pub = urgent ? (S.support?.public_emergency || []) : [];
  const sh = openSheet(`<h3>${ic('check')} ส่งเรื่องแล้ว · <span class="num">${esc(t.ticket_no)}</span></h3>
    <p class="lead" style="color:var(--mut2);font-size:16px">ต้องการโทรสายด่วนด้วยไหม?</p>
    ${list.length ? `<div class="glass group hot">${list.map(x => callRow(x.phone, x.name, x.sub)).join('')}</div>`
      : `<p class="hint">ยังไม่มีเบอร์สายด่วนในระบบ — ใช้เมนู AI CS Agent › ข้อความ เพื่อติดต่อเจ้าหน้าที่</p>`}
    ${pub.length ? `<div class="sec"><h4>เบอร์ฉุกเฉินสาธารณะ</h4></div><div class="glass group hot">${pub.map(e => callRow(e.phone, e.name, '')).join('')}</div>` : ''}
    <div class="btn-row"><button class="btn btn-ghost" data-close>ไม่ต้องโทร</button></div>`);
  $$('a.call', sh.el).forEach(a => a.addEventListener('click', () => {
    run('cs_msg_send', { p_token: T(), p_vehicle: t.vehicle_id, p_body: `ผู้ใช้โทรสายด่วน ${a.querySelector('small').textContent.split(' · ')[0]} หลังส่งแจ้งบริการ ${t.ticket_no}`, p_ticket: t.id, p_emergency: false });
    setTimeout(() => sh.close(), 400);
  }));
}
