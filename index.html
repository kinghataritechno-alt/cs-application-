});
function docForm(d) {
  const staff = S.can('cs_operator', 'service_manager', 'admin');
  const MAXF = 10;
  const keep = (d?.files || []).slice();   // ไฟล์เดิมที่ยังเก็บไว้
  const drop = [];                         // ไฟล์เดิมที่จะลบเมื่อกดบันทึก
  const adds = [];                         // ไฟล์ใหม่ที่จะอัปโหลด
  const sh = openSheet(`<h3>${ic('doc')} ${d ? 'แก้ไขเอกสาร' : 'อัปโหลดเอกสาร'}</h3>
    <label class="fl">ไฟล์เอกสาร (PDF หรือภาพ ไฟล์ละไม่เกิน 4 MB · สูงสุด ${MAXF} ไฟล์)</label>
    <div class="filebox" id="df-box">
      <div id="df-list" class="flist"></div>
      <div class="row2"><button type="button" class="btn btn-ghost" id="df-f">${ic('file', 'sm')} เลือกไฟล์</button><button type="button" class="btn btn-ghost" id="df-cam">${ic('camera', 'sm')} ถ่ายภาพ</button></div>
      <div class="hint" style="margin:8px 0 0">เลือกได้ทีละหลายไฟล์ · ถ่ายภาพได้ทีละหน้าแล้วกดถ่ายต่อ</div></div>
    <label class="fl" for="df-t">ชื่อเอกสาร <span class="req">*</span></label><input class="in" id="df-t" maxlength="200" value="${esc(d?.title || '')}" placeholder="เช่น ใบส่งมอบรถ / กรมธรรม์ประกันภัย">
    <label class="fl" for="df-c">หมวด</label><select class="in" id="df-c">${Object.entries(L.doccat).map(([k, [l]]) => `<option value="${k}" ${(d?.category || 'other') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
    ${staff ? `<label class="fl" for="df-sc">ใช้กับ</label><select class="in" id="df-sc"><option value="vehicle" ${!d || d.vehicle_id ? 'selected' : ''}>รถคันนี้ (${esc(S.vehicle?.plate || '')})</option>
      ${S.models.map(m => `<option value="m:${esc(m)}" ${d && !d.vehicle_id && d.model === m ? 'selected' : ''}>ทุกคันรุ่น ${esc(m)}</option>`).join('')}<option value="all" ${d && !d.vehicle_id && !d.model ? 'selected' : ''}>ทุกคันทุกรุ่น</option></select>` : ''}
    <div class="row2"><div><label class="fl" for="df-n">เลขที่เอกสาร</label><input class="in" id="df-n" maxlength="60" value="${esc(d?.doc_no || '')}"></div>
      <div><label class="fl" for="df-i">วันที่ออก</label><input class="in" id="df-i" type="date" value="${d?.issued_at || ''}"></div></div>
    <label class="fl" for="df-e">วันหมดอายุ (ถ้ามี — ระบบจะแจ้งเตือนก่อนหมดอายุ)</label><input class="in" id="df-e" type="date" value="${d?.expires_at || ''}">
    <label class="fl" for="df-u">หรือใส่ลิงก์เอกสาร (https://)</label><input class="in" id="df-u" type="url" maxlength="1000" value="${esc(d?.url || '')}" placeholder="ไม่บังคับ ถ้าแนบไฟล์แล้ว">
    <div class="btn-row">${d ? `<button class="btn btn-ghost" id="df-del" style="color:#FF9C8A;flex:0 0 auto">${ic('trash', 'sm')} ลบ</button>` : ''}<button class="btn btn-ghost" data-close>ยกเลิก</button><button class="btn btn-acc" id="df-s">${d ? 'บันทึก' : 'อัปโหลด'}</button></div>`);
  const total = () => keep.length + adds.length;
  const drawList = () => {
    const row = (f, kind, i) => `<div class="frow"><span class="fi">${ic(f.mime === 'application/pdf' ? 'file' : 'camera', 'sm')}</span>
      <span class="fn">${esc(f.file_name || f.name || 'ไฟล์')}<small>${kind === 'new' ? 'ไฟล์ใหม่ · ' : ''}${f.size ? fmtSize(f.size) : ''}</small></span>
      ${kind === 'old' ? `<button type="button" class="icon-btn sm" data-fv="${i}" aria-label="เปิดดู">${ic('eye', 'sm')}</button>` : ''}
      <button type="button" class="icon-btn sm" data-fx="${kind}:${i}" aria-label="นำไฟล์ออก" style="color:#FF9C8A">${ic('trash', 'sm')}</button></div>`;
    $('#df-list', sh.el).innerHTML = total()
      ? `<div class="hint" style="margin:0 0 6px">${total()} ไฟล์${drop.length ? ` · จะลบ ${drop.length} ไฟล์เมื่อกดบันทึก` : ''}</div>` + keep.map((f, i) => row(f, 'old', i)).join('') + adds.map((f, i) => row(f, 'new', i)).join('')
      : `<div class="hint" style="margin:0 0 8px">${drop.length ? `จะลบ ${drop.length} ไฟล์เมื่อกดบันทึก · ` : ''}ยังไม่ได้เลือกไฟล์</div>`;
    $$('[data-fv]', sh.el).forEach(b => b.onclick = () => { const f = keep[+b.dataset.fv]; openAttachment(f.id, f.file_name); });
    $$('[data-fx]', sh.el).forEach(b => b.onclick = () => {
      const [k, i] = b.dataset.fx.split(':');
      if (k === 'old') drop.push(...keep.splice(+i, 1)); else adds.splice(+i, 1);
      drawList();
    });
    $('#df-f', sh.el).disabled = $('#df-cam', sh.el).disabled = total() >= MAXF;
  };
  const pick = async (accept, cam = false) => {
    const fs = await pickFiles(accept, !cam, cam); if (!fs.length) return;
    let skipped = 0;
    for (const f of fs) {
      if (total() >= MAXF) { skipped++; continue; }
      try {
        let x;
        if (f.type === 'application/pdf') {
          if (f.size > 4 * 1024 * 1024) { toast(`${f.name} ใหญ่เกิน 4 MB — กรุณาบีบอัดหรือใช้ลิงก์แทน`, true); continue; }
          x = await readFileB64(f);
        } else if (f.type.startsWith('image/')) x = await compressImage(f, 2000, 0.8);
        else { toast(`${f.name}: รองรับเฉพาะ PDF หรือภาพ`, true); continue; }
        adds.push({ ...x, size: Math.round(x.data.length * 0.75) });
        const t = $('#df-t', sh.el); if (!t.value.trim()) t.value = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
      } catch (e) { toast(e.message, true); }
    }
    if (skipped) toast(`แนบได้สูงสุด ${MAXF} ไฟล์ — ข้าม ${skipped} ไฟล์`, true);
    drawList();
  };
  drawList();
  $('#df-f', sh.el).onclick = () => pick('application/pdf,image/*');
  $('#df-cam', sh.el).onclick = () => pick('image/*', true);
  $('#df-s', sh.el).onclick = e => withBusy(e.currentTarget, async () => {
    const sc = staff ? $('#df-sc', sh.el).value : 'vehicle';
    const p = { id: d?.id || null, category: $('#df-c', sh.el).value, title: $('#df-t', sh.el).value.trim(), doc_no: $('#df-n', sh.el).value,
      issued_at: $('#df-i', sh.el).value, expires_at: $('#df-e', sh.el).value, url: $('#df-u', sh.el).value.trim(),
      vehicle_id: sc === 'vehicle' ? S.vid : null, model: sc.startsWith('m:') ? sc.slice(2) : null };
    if (!p.title) { toast('กรุณาระบุชื่อเอกสาร', true); $('#df-t', sh.el).focus(); return; }
    if (!p.url && !total()) { toast('กรุณาเลือกไฟล์อย่างน้อย 1 ไฟล์ หรือใส่ลิงก์เอกสาร', true); return; }
    const r = await run('cs_doc_save', { p_token: T(), p });
    if (!r) return;
    let fail = 0;
    for (const f of drop) if (!await run('cs_attach_delete', { p_token: T(), p_id: f.id })) fail++;
    drop.length = 0;
    const newIds = [];
    for (let i = 0; i < adds.length; i++) {
      const f = adds[i];
      const btn = $('#df-s', sh.el); if (btn && adds.length > 1) btn.innerHTML = `<span class="spin" style="width:18px;height:18px;border-width:2px"></span> ${i + 1}/${adds.length}`;
      const a = await run('cs_attach_add', { p_token: T(), p_ref_type: 'document', p_ref: r.id, p_name: f.name, p_mime: f.mime, p_data: f.data });
      if (a) newIds.push(a.id); else fail++;
    }
    if (fail) toast(`บันทึกข้อมูลแล้ว แต่มี ${fail} ไฟล์ไม่สำเร็จ — กดแก้ไขเพื่อแนบใหม่`, true);
    else toast(d ? 'บันทึกเอกสารแล้ว' : `อัปโหลดเอกสารแล้ว${adds.length > 1 ? ` (${adds.length} ไฟล์)` : ''}`);
    sh.close(); render();
    // กรมธรรม์ / พ.ร.บ. / ทะเบียนรถ ของรถคันนี้ → ให้ AI ดึงข้อมูลมากรอกให้อัตโนมัติ (เจ้าหน้าที่ตรวจก่อนบันทึก)
    if (newIds.length && canExtract() && EXTRACT_CATS.includes(p.category) && p.vehicle_id) {
      extractDoc({ id: r.id, title: p.title, category: p.category }, [...keep.map(f => f.id), ...newIds]);
    }
  });
  $('#df-del', sh.el)?.addEventListener('click', async () => { if (await deleteDoc(d)) { sh.close(); render(); } });
}

async function emergency() {
  const kind = await choose('แจ้งเหตุฉุกเฉิน — เกิดอะไรขึ้น?', [
    { value: 'อุบัติเหตุ', label: 'อุบัติเหตุ', icon: 'crash' }, { value: 'รถดับ/เสียกลางทาง', label: 'รถดับ / เสียกลางทาง', icon: 'wrench' },
    { value: 'ควัน/กลิ่นไหม้/แบตเตอรี่ผิดปกติ', label: 'ควัน กลิ่นไหม้ แบตเตอรี่ผิดปกติ', sub: 'ออกห่างจากรถทันที · ไฟไหม้โทร 199', icon: 'siren' },
    { value: 'เหตุร้าย/ความปลอดภัย', label: 'เหตุร้าย / ความปลอดภัย', sub: 'โทร 191', icon: 'shield' }, { value: 'อื่น ๆ', label: 'อื่น ๆ', icon: 'dots' }]);
  if (!kind) return;
  toast('กำลังระบุตำแหน่ง…');
  const p = await getGPS();
  const loc = p ? `ตำแหน่ง: https://maps.google.com/?q=${p.lat.toFixed(6)},${p.lng.toFixed(6)}` : 'ตำแหน่ง: ไม่ได้รับสิทธิ์ GPS';
  const note = await confirmBox('ส่งแจ้งเหตุฉุกเฉิน', `<b>${esc(kind)}</b>\n${esc(loc)}\n\nมีผู้บาดเจ็บโทร 1669 ทันที`, { ok: 'ส่งแจ้งเหตุ', danger: true, input: { label: 'รายละเอียดเพิ่มเติม (ถ้ามี)', placeholder: 'เช่น จุดสังเกต อาการรถ', max: 1000 } });
  if (note === null) return;
  const v = S.home?.vehicle || S.vehicle || {};
  const body = `แจ้งเหตุฉุกเฉิน: ${kind}\nรถ ${v.model || ''} ทะเบียน ${v.plate || ''}\n${loc}${note ? '\nรายละเอียด: ' + note : ''}`;
  if (await run('cs_msg_send', { p_token: T(), p_vehicle: S.vid, p_body: body, p_ticket: null, p_emergency: true }, 'ส่งแจ้งเหตุถึง SMART CS แล้ว')) {
    const create = await confirmBox('สร้าง Ticket ด้วยไหม?', 'เพื่อให้ติดตามงานและแนบภาพได้', { ok: 'สร้าง Ticket', cancel: 'ไม่ตอนนี้' });
    if (create) {
      const cat = kind === 'อุบัติเหตุ' ? 'accident' : kind.startsWith('รถดับ') ? 'breakdown' : 'help';
      sstore.set('mcs_ai_draft', { category: cat, priority: 'urgent', title: 'แจ้งเหตุฉุกเฉิน: ' + kind, detail: (note || kind), location: p ? `พิกัด ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}` : '' });
      go('request?from=ai');
    } else go('contact?tab=chat');
  }
}

// เพิ่มยี่ห้อ/รุ่นรถใหม่ (บันทึกลงรายการรุ่นรถของระบบ) → คืนชื่อรุ่นที่บันทึก
function addModelSheet() {
  return new Promise(res => {
    let done = false;
    const brands = [...new Set(S.models.map(m => m.split(' ')[0]))];
    const sh = openSheet(`<h3>${ic('car')} เพิ่มยี่ห้อ/รุ่นรถใหม่</h3>
      <p class="lead">ชื่อที่บันทึก = ยี่ห้อ + รุ่น เช่น "BYD ATTO 3" · ใช้ได้กับรถทุกคันในระบบ</p>
      <label class="fl" for="nm-b">ยี่ห้อ <span class="req">*</span></label><input class="in" id="nm-b" maxlength="25" list="nm-bl" placeholder="เช่น BYD / NETA / MG / TOYOTA" autocapitalize="characters">
      <datalist id="nm-bl">${brands.map(b => `<option value="${esc(b)}">`).join('')}</datalist>
      <label class="fl" for="nm-m">รุ่น <span class="req">*</span></label><input class="in" id="nm-m" maxlength="34" placeholder="เช่น ATTO 3 / V II / ES">
      <div class="hint" id="nm-pv" style="margin-top:10px"></div>
      <div class="btn-row"><button class="btn btn-ghost" data-close>ยกเลิก</button><button class="btn btn-acc" id="nm-s">${ic('plus', 'sm')} เพิ่มรุ่นนี้</button></div>`,
      { onClose: () => { if (!done) res(null); } });
    const name = () => `${$('#nm-b', sh.el).value.trim()} ${$('#nm-m', sh.el).value.trim()}`.replace(/\s+/g, ' ').trim();
    const pv = () => { const n = name(), dup = S.models.find(x => x.toLowerCase() === n.toLowerCase());
      $('#nm-pv', sh.el).innerHTML = n ? `จะบันทึกเป็น: <b style="color:#fff">${esc(n)}</b>${dup ? ' <span class="tag">มีในระบบแล้ว</span>' : ''}` : ''; };
    $('#nm-b', sh.el).oninput = pv; $('#nm-m', sh.el).oninput = pv;
    $('#nm-s', sh.el).onclick = e => withBusy(e.currentTarget, async () => {
      if (!$('#nm-b', sh.el).value.trim() || !$('#nm-m', sh.el).value.trim()) { toast('กรุณาระบุทั้งยี่ห้อและรุ่น', true); return; }
      const r = await run('cs_model_add', { p_token: T(), p_model: name() });
      if (!r) return;
      S.models = r.models;
      toast(r.added ? `เพิ่มรุ่น ${r.model} แล้ว` : `มีรุ่น ${r.model} ในระบบอยู่แล้ว`);
      done = true; sh.close(); res(r.model);
    });
  });
}

function boot() {
  const s = store.get('mcs_sess');
  if (s?.token) Object.assign(S, { token: s.token, kind: s.kind, role: s.role, vid: s.vid });
  const upd = () => { const o = !navigator.onLine; let b = $('.offline'); if (o && !b) { b = document.createElement('div'); b.className = 'offline'; b.textContent = 'ออฟไลน์ — ข้อมูลอาจไม่เป็นปัจจุบัน'; document.body.appendChild(b); } else if (!o && b) b.remove(); };
  addEventListener('online', upd); addEventListener('offline', upd); upd();
  if (window.visualViewport) visualViewport.addEventListener('resize', () => document.body.classList.toggle('kb', visualViewport.height < innerHeight * 0.75));
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
}
boot();

/* ---------- ผู้มีสิทธิ์ใช้รถ (Username = ชื่อ-สกุล, Password = เลขทะเบียน) ---------- */
async function vehicleUsersSheet(v) {
  const list = await run('cs_vehicle_users_list', { p_token: T(), p_vehicle: v.id });
  if (!list) return;
  const sh = openSheet(`<h3>${ic('users')} ผู้มีสิทธิ์เข้าใช้แอป</h3>
    <p class="lead">${esc(v.model)} · ทะเบียน ${esc(v.plate)}<br>เข้าระบบด้วย <b>Username = ชื่อ-สกุล</b> และ <b>Password = เลขทะเบียน ${esc(v.plate)}</b></p>
    <div class="list">${list.length ? list.map(u => `<div class="well item" style="${u.active ? '' : 'opacity:.55'}"><span class="ic">${ic('user')}</span>
      <span class="bd"><b>${esc(u.full_name)}</b><span class="meta">${u.position ? esc(u.position) + ' · ' : ''}${u.phone ? esc(u.phone) + ' · ' : ''}${u.active ? (u.last_login ? 'เข้าล่าสุด ' + fmtRel(u.last_login) : 'ยังไม่เคยเข้าระบบ') : '<span class="tag bad">ระงับ</span>'}</span></span>
      <button class="icon-btn" data-vu="${u.id}" aria-label="แก้ไข">${ic('edit', 'sm')}</button></div>`).join('')
      : `<div class="empty" style="padding:16px">ยังไม่มีผู้มีสิทธิ์ — เพิ่มชื่อผู้ใช้รถอย่างน้อย 1 คน</div>`}</div>
    <div class="btn-row"><button class="btn btn-ghost" data-close>ปิด</button><button class="btn btn-acc" id="vu-add">${ic('plus', 'sm')} เพิ่มผู้ใช้</button></div>`);
  $('#vu-add', sh.el).onclick = () => { sh.close(); vehicleUserForm(v, null); };
  $$('[data-vu]', sh.el).forEach(b => b.onclick = () => { sh.close(); vehicleUserForm(v, list.find(u => u.id === b.dataset.vu)); });
}
function vehicleUserForm(v, u) {
  const sh = openSheet(`<h3>${ic('user')} ${u ? 'แก้ไขผู้ใช้รถ' : 'เพิ่มผู้ใช้รถ'}</h3>
    <label class="fl" for="vu-n">ชื่อ-สกุล (ใช้เป็น Username) <span class="req">*</span></label><input class="in" id="vu-n" maxlength="120" value="${esc(u?.full_name || '')}" placeholder="เช่น นายสมชาย ใจดี" autocomplete="off">
    <p class="hint">ตอนเข้าระบบ พิมพ์มีหรือไม่มีคำนำหน้า (นาย/นาง/นางสาว) และเว้นวรรคต่างกันได้</p>
    <div class="row2"><div><label class="fl" for="vu-p">ตำแหน่ง</label><input class="in" id="vu-p" maxlength="120" value="${esc(u?.position || '')}"></div>
      <div><label class="fl" for="vu-t">เบอร์โทร</label><input class="in" id="vu-t" type="tel" maxlength="20" value="${esc(u?.phone || '')}"></div></div>
    ${u ? `<label class="toggle"><span>อนุญาตให้เข้าระบบ</span><span class="sw"><input type="checkbox" id="vu-a" ${u.active ? 'checked' : ''}><span></span></span></label>` : ''}
    <div class="btn-row">${u ? `<button class="btn btn-ghost" id="vu-del" style="color:#FF9C8A;flex:0 0 auto">${ic('trash', 'sm')} ลบ</button>` : ''}<button class="btn btn-ghost" id="vu-back">ย้อนกลับ</button><button class="btn btn-acc" id="vu-s">บันทึก</button></div>`);
  const back = () => { sh.close(); vehicleUsersSheet(v); };
  $('#vu-back', sh.el).onclick = back;
  $('#vu-s', sh.el).onclick = e => withBusy(e.currentTarget, async () => {
    const p = { id: u?.id || null, vehicle_id: v.id, full_name: $('#vu-n', sh.el).value, position: $('#vu-p', sh.el).value, phone: $('#vu-t', sh.el).value.trim() || null,
      active: u ? $('#vu-a', sh.el).checked : true };
    if (!p.full_name.trim()) { toast('กรุณากรอกชื่อ-สกุล', true); return; }
    if (await run('cs_vehicle_user_save', { p_token: T(), p }, 'บันทึกแล้ว')) back();
  });
  $('#vu-del', sh.el)?.addEventListener('click', async () => {
    if (await confirmBox('ลบสิทธิ์ผู้ใช้นี้?', `${esc(u.full_name)} จะเข้าระบบด้วยรถ ${esc(v.plate)} ไม่ได้อีก`, { ok: 'ลบสิทธิ์', danger: true }) &&
        await run('cs_vehicle_user_remove', { p_token: T(), p_id: u.id }, 'ลบสิทธิ์แล้ว')) back();
    else vehicleUsersSheet(v);
  });
}

/* ---------- สายด่วน (ใช้ร่วมกัน: หน้า AI CS Agent และหลังส่งแจ้งบริการ) ---------- */
const telOf = p => String(p || '').replace(/[^\d+]/g, '');
function callRow(phone, name, sub) {
  return `<a class="rowlink call" href="tel:${esc(telOf(phone))}">${ic('phone')}<span>${esc(name)}<br><small>${esc(phone)}${sub ? ' · ' + esc(sub) : ''}</small></span>${ic('chevR', 'sm')}</a>`;
}
function hotlinesSync() {
  const sp = S.support || {}, out = [];
  if (sp.emergency_phone) out.push({ phone: sp.emergency_phone, name: sp.emergency_name || 'สายด่วน SMART', sub: '' });
  if (sp.cs_phone) out.push({ phone: sp.cs_phone, name: 'SMART Customer Service', sub: sp.cs_hotline_hours || '' });
  return out;
}
const contactsCache = {};
async function getHotlines() {
  const out = hotlinesSync();
  if (S.vid) {
    let cs = contactsCache[S.vid];
    if (!cs) { cs = (await api('cs_vehicle_get', { p_token: T(), p_vehicle: S.vid })).contacts || []; contactsCache[S.vid] = cs; }
    cs.filter(c => c.phone && ['smart_cs', 'smart_manager', 'emergency'].includes(c.kind))
      .forEach(c => out.push({ phone: c.phone, name: c.name, sub: c.position || L.ckind[c.kind] || '' }));
  }
  const seen = new Set();
  return out.filter(x => { const k = telOf(x.phone); if (!k || seen.has(k)) return false; seen.add(k); return true; });
}
// หลังส่งแจ้งบริการสำเร็จ: ถามว่าต้องการโทรสายด่วนด้วยไหม
async function askHotline(t) {
  let list = [];
  try { list = await getHotlines(); } catch {}
  const urgent = t.category === 'accident' || t.priority === 'urgent';
  const pub = urgent ? (S.support?.public_emergency || []) : [];
  const sh = openSheet(`<h3>${ic('check')} ส่งเรื่องแล้ว · <span class="num">${esc(t.ticket_no)}</span></h3>
    <p class="lead" style="color:var(--mut2);font-size:16px">ต้องการโทรสายด่วนด้วยไหม?</p>
    ${list.length ? `<div class="glass group hot">${list.map(x => callRow(x.phone, x.name, x.sub)).join('')}</div>`
      : `<p class="hint">ยังไม่มีเบอร์สายด่วนในระบบ — ใช้เมนู AI CS Agent › ข้อความ เพื่อติดต่อเจ้าหน้าที่</p>`}
    ${pub.length ? `<div class="sec"><h4>เบอร์ฉุกเฉินสาธารณะ</h4></div><div class="glass group hot">${pub.map(e => callRow(e.phone, e.name, '')).join('')}</div>` : ''}
    <div class="btn-row"><button class="btn btn-ghost" data-close>ไม่ต้องโทร</button></div>`);
  $$('a.call', sh.el).forEach(a => a.addEventListener('click', () => {
    run('cs_msg_send', { p_token: T(), p_vehicle: t.vehicle_id, p_body: `ผู้ใช้โทรสายด่วน ${a.querySelector('small').textContent.split(' · ')[0]} หลังส่งแจ้งบริการ ${t.ticket_no}`, p_ticket: t.id, p_emergency: false });
    setTimeout(() => sh.close(), 400);
  }));
}

/* =====================================================================
   AI ดึงข้อมูลจากเอกสาร (กรมธรรม์ประกันภัย / พ.ร.บ. / สำเนาทะเบียนรถ)
   AI อ่าน → เจ้าหน้าที่ตรวจ/ติ๊กเลือก → บันทึกลงข้อมูลรถ + ข้อมูลที่ AI จำ
   ===================================================================== */
const EXTRACT_CATS = ['insurance', 'act', 'registration'];
const canExtract = () => S.can('cs_operator', 'service_manager', 'admin');
const plateKey = p => String(p || '').replace(/[\s\-.]/g, '').toLowerCase();

async function aiExtract(ids, kind) {
  let r;
  try {
    r = await fetch(`${CFG.url}/functions/v1/${CFG.aiFn}`, { method: 'POST', headers: apiHeaders(),
      body: JSON.stringify({ action: 'extract', token: S.token, vehicle_id: S.vid, attachment_ids: ids, doc_kind: kind }) });
  } catch { throw new Error(navigator.onLine ? 'เชื่อมต่อ AI ไม่ได้ กรุณาลองใหม่' : 'ไม่มีสัญญาณอินเทอร์เน็ต'); }
  const d = await r.json().catch(() => null);
  if (r.status === 401 && d && /^SESSION/.test(d.error || '')) { endSession(); throw new Error('SESSION'); }
  if (!r.ok || !d || !d.result) throw new Error((d && d.error) || 'AI อ่านเอกสารไม่ได้ชั่วคราว (ระบบดึงข้อมูลอาจยังไม่ได้ติดตั้ง)');
  return d.result;
}

// เรียกจากศูนย์เอกสาร: doc = { id, title, category, files }
async function extractDoc(doc, fileIds) {
  if (!canExtract()) return;
  const ids = (fileIds || (doc.files || []).map(f => f.id)).slice(0, 6);
  if (!ids.length) { toast('เอกสารนี้ยังไม่มีไฟล์', true); return; }
  const wait = openSheet(`<h3>${ic('spark')} AI กำลังอ่านเอกสาร</h3>
    <p class="lead">${esc(doc.title || '')} · ${ids.length} ไฟล์</p>
    <div class="loading" style="padding:26px 0"><div class="spin"></div></div>
    <p class="hint" style="text-align:center">ใช้เวลาประมาณ 10–40 วินาที · ยังไม่มีการบันทึกจนกว่าท่านจะตรวจและกดยืนยัน</p>`);
  let res, v;
  try {
    [res, v] = await Promise.all([aiExtract(ids, doc.category), api('cs_vehicle_get', { p_token: T(), p_vehicle: S.vid }).then(d => d.vehicle)]);
  } catch (e) {
    wait.close();
    if (e.message !== 'SESSION') toast(e.message, true, 6000);
    return;
  }
  wait.close();
  extractReview(doc, res, v);
}

function extractReview(doc, r, v) {
  const type = r.doc_type && r.doc_type !== 'other' ? r.doc_type : doc.category;
  const money = n => (n || n === 0) ? fmtNum(n) + ' บาท' : '';
  const vin = String(r.vin || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const vinOk = /^[A-HJ-NPR-Z0-9]{11,17}$/.test(vin);
  let insName = r.insurer || '';
  if (insName && type === 'insurance') {
    const extra = [r.insurance_class ? 'ประเภท ' + r.insurance_class : '', r.repair_type || '', r.sum_insured ? 'ทุน ' + money(r.sum_insured) : ''].filter(Boolean).join(' ');
    if (extra) insName = `${insName} (${extra})`.slice(0, 120);
  }
  const rows = [
    ['vin', 'เลขตัวถัง (VIN)', vin, false],
    ['color', 'สี', r.color || '', false],
    ...(type === 'insurance' ? [['insurance_company', 'บริษัทประกันภัย', insName, false], ['insurance_no', 'เลขกรมธรรม์', r.policy_no || '', false],
      ['insurance_exp', 'ประกันภัยหมดอายุ', r.coverage_end || '', true]] : []),
    ...(type === 'act' ? [['act_exp', 'พ.ร.บ. หมดอายุ', r.coverage_end || '', true]] : []),
    ...(type === 'registration' ? [['tax_exp', 'ภาษีรถครบกำหนด', r.tax_due || '', true]] : [])
  ].filter(x => x[2]);
  const warn = [...(r.warnings || [])];
  if (r.plate && plateKey(r.plate) !== plateKey(v.plate)) warn.unshift(`ทะเบียนในเอกสาร "${r.plate}" ไม่ตรงกับรถ ${v.plate} — ตรวจว่าเป็นเอกสารของรถคันนี้`);
  if (vin && v.vin && vin !== v.vin) warn.unshift(`เลขตัวถังในเอกสาร ${vin} ไม่ตรงกับในระบบ ${v.vin}`);
  if (vin && !vinOk) warn.push(`เลขตัวถังที่อ่านได้ "${vin}" รูปแบบไม่ถูกต้อง จึงไม่บันทึก`);
  const show = (k, val) => !val ? '–' : /_exp$/.test(k) ? fmtDate(val) : esc(val);
  const facts = (r.facts || []).filter(f => f && f.text);
  const curTopics = new Set((v.ai_facts || []).map(f => f.topic));
  const tname = { insurance: 'กรมธรรม์ประกันภัยรถยนต์', act: 'กรมธรรม์ พ.ร.บ.', registration: 'สำเนาทะเบียนรถ' }[type] || 'เอกสารรถ';
  const sh = openSheet(`<h3>${ic('spark')} ข้อมูลที่ AI อ่านได้</h3>
    <p class="lead">${esc(tname)} · ${esc(doc.title || '')}<br>ติ๊กเฉพาะรายการที่ถูกต้อง แล้วกดบันทึก (ตรวจกับเอกสารจริงก่อนทุกครั้ง)</p>
    ${warn.length ? `<div class="banner">${warn.map(w => `${ic('info', 'sm')} ${esc(w)}`).join('<br>')}</div>` : ''}
    ${rows.length ? `<div class="sec" style="margin-top:6px"><h4>ข้อมูลรถ</h4></div><div class="xrows">${rows.map(([k, label, val], i) => {
      const cur = v[k] || '', same = String(cur) === String(val), bad = k === 'vin' && (!vinOk || (v.vin && v.vin !== vin));
      return `<label class="xrow ${same ? 'same' : ''}"><input type="checkbox" data-f="${i}" ${!same && !bad ? 'checked' : ''} ${k === 'vin' && !vinOk ? 'disabled' : ''}>
        <span class="xl">${label}</span><span class="xv"><b>${show(k, val)}</b>${same ? '<small>ตรงกับในระบบแล้ว</small>' : `<small>เดิม: ${show(k, cur)}</small>`}</span></label>`; }).join('')}</div>` : ''}
    ${facts.length ? `<div class="sec"><h4>ข้อมูลให้ AI CS Agent จำ</h4></div><p class="hint" style="margin-top:-4px">หัวข้อที่มีอยู่แล้วจะถูกแทนที่ด้วยข้อความใหม่</p>
      <div class="xrows">${facts.map((f, i) => `<label class="xrow fact"><input type="checkbox" data-k="${i}" checked>
        <span class="xv"><b>${esc(f.topic)}${curTopics.has(f.topic) ? ' <span class="tag">แทนที่ของเดิม</span>' : ' <span class="tag acc">ใหม่</span>'}</b><small>${esc(f.text)}</small></span></label>`).join('')}</div>` : ''}
    ${!rows.length && !facts.length ? `<div class="empty">${ic('doc')}<b>ไม่พบข้อมูลที่ใช้ได้</b>ลองไฟล์ที่ชัดกว่านี้ หรือกรอกเองที่ จัดการรถ</div>` : ''}
    ${(r.owner || r.possessor || r.brand || r.model || r.model_year) ? `<p class="hint">${[r.brand && 'ยี่ห้อ ' + esc(r.brand), r.model && 'รุ่น ' + esc(r.model), r.model_year && 'ปี ' + esc(r.model_year),
      r.owner && 'ผู้ถือกรรมสิทธิ์ ' + esc(r.owner), r.possessor && 'ผู้ครอบครอง ' + esc(r.possessor)].filter(Boolean).join(' · ')}</p>` : ''}
    <div class="btn-row"><button class="btn btn-ghost" data-close>ยกเลิก</button>${rows.length || facts.length ? `<button class="btn btn-acc" id="xr-s">${ic('check', 'sm')} บันทึกที่เลือก</button>` : ''}</div>`);
  $('#xr-s', sh.el)?.addEventListener('click', e => withBusy(e.currentTarget, async () => {
    const p = {}; $$('[data-f]:checked', sh.el).forEach(c => { const [k, , val] = rows[+c.dataset.f]; p[k] = val; });
    const fs = $$('[data-k]:checked', sh.el).map(c => ({ topic: facts[+c.dataset.k].topic, text: facts[+c.dataset.k].text.slice(0, 600) }));
    if (!Object.keys(p).length && !fs.length) { toast('ยังไม่ได้เลือกรายการ', true); return; }
    if (await run('cs_vehicle_apply_extract', { p_token: T(), p_vehicle: S.vid, p, p_facts: fs, p_doc: doc.id || null },
      `บันทึกแล้ว: ข้อมูลรถ ${Object.keys(p).length} ช่อง · ข้อมูลให้ AI จำ ${fs.length} รายการ`)) {
      S.home = null; sh.close(); render();
    }
  }));
}

</script>
